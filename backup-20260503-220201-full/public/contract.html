<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OKNC 合约交易面板</title>
<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e1a;--card:#131a2b;--card2:#1a2340;--border:#2a3560;--text:#d0d8f0;--text2:#7a8ab5;--green:#00c087;--red:#f05555;--gold:#f0b050;--blue:#3b82f6;--radius:10px}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.auth-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999}
.auth-box{background:var(--card);padding:40px;border-radius:var(--radius);width:340px;border:1px solid var(--border)}
.auth-box h2{text-align:center;margin-bottom:24px;font-size:22px;color:var(--gold)}
.auth-box input{width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:16px;outline:none;margin-bottom:16px}
.auth-box input:focus{border-color:var(--blue)}
.auth-box button{width:100%;padding:12px;border:none;border-radius:8px;font-size:16px;cursor:pointer;font-weight:600}
.auth-box .btn-login{background:var(--blue);color:#fff}
.auth-box .btn-login:hover{opacity:.9}
.auth-box .error{color:var(--red);text-align:center;font-size:14px;margin-top:8px;display:none}
.hidden{display:none!important}
.container{max-width:1400px;margin:0 auto;padding:12px}
.top-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:10px;flex-wrap:wrap}
.top-bar .logo{font-size:18px;font-weight:700;color:var(--gold);white-space:nowrap}
.top-bar .logo span{color:var(--text2);font-weight:400;font-size:13px;margin-left:6px}
.balance-box{background:var(--card2);padding:6px 14px;border-radius:8px;font-size:14px;white-space:nowrap;margin-left:auto}
.balance-box .num{font-weight:700;color:var(--green);font-size:16px}
.balance-box .pnl{font-size:12px;margin-left:6px}
.pnl-pos{color:var(--green)}.pnl-neg{color:var(--red)}
.style-group{display:flex;gap:4px}
.style-btn{padding:5px 12px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text2);cursor:pointer;font-size:13px;transition:.2s}
.style-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.style-btn:hover:not(.active){border-color:var(--text2)}
.toggle-group{display:flex;align-items:center;gap:8px}
.toggle{width:44px;height:24px;background:var(--card2);border-radius:12px;cursor:pointer;position:relative;transition:.3s;border:1px solid var(--border)}
.toggle.active{background:var(--green);border-color:var(--green)}
.toggle .knob{width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:.3s}
.toggle.active .knob{left:22px}
.toggle-label{font-size:13px;color:var(--text2)}
.toggle-label.active{color:var(--green)}
.status-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:12px}
.status-badge.on{background:rgba(0,192,135,.15);color:var(--green)}
.status-badge.off{background:rgba(240,85,85,.15);color:var(--red)}
.status-badge.warn{background:rgba(240,176,80,.15);color:var(--gold)}
.main-grid{display:grid;grid-template-columns:1fr 340px;gap:10px}
@media(max-width:960px){.main-grid{grid-template-columns:1fr}}
.chart-section{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:12px;min-height:420px}
.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.chart-header .symbol{font-size:16px;font-weight:600}
.chart-header .price{font-size:24px;font-weight:700}
.chart-header .price.change{color:var(--green)}.chart-header .price.drop{color:var(--red)}
.tf-group{display:flex;gap:3px}
.tf-btn{padding:3px 10px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--text2);cursor:pointer;font-size:12px;transition:.2s}
.tf-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
#chart{width:100%;height:360px}
.right-panel{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:12px}
.card-title{font-size:13px;color:var(--text2);margin-bottom:10px;font-weight:600;display:flex;align-items:center;gap:6px}
.position{background:var(--card2);border-radius:8px;padding:10px;margin-bottom:6px;border-left:3px solid var(--green)}
.position.short{border-left-color:var(--red)}
.pos-symbol{font-size:14px;font-weight:600}
.pos-symbol .side{padding:1px 6px;border-radius:4px;font-size:11px;margin-left:4px}
.side-long{background:rgba(0,192,135,.2);color:var(--green)}
.side-short{background:rgba(240,85,85,.2);color:var(--red)}
.pos-detail{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:12px;margin-top:6px}
.pos-detail .label{color:var(--text2)}.pos-detail .value{text-align:right}
.btn-close{width:100%;margin-top:8px;padding:6px;border:none;border-radius:6px;font-size:12px;cursor:pointer;font-weight:600;background:var(--red);color:#fff}
.btn-close:hover{opacity:.85}
.no-pos{text-align:center;padding:20px;color:var(--text2);font-size:13px}
.symbol-select{display:flex;gap:4px;margin-bottom:8px}
.sym-btn{padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text2);cursor:pointer;font-size:13px;flex:1;text-align:center;transition:.2s}
.sym-btn.active{background:var(--card2);border-color:var(--blue);color:var(--text)}
.side-btns{display:flex;gap:6px;margin-bottom:8px}
.side-btn{flex:1;padding:8px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.side-btn.long{background:rgba(0,192,135,.2);color:var(--green);border:1px solid transparent}
.side-btn.long.active{background:var(--green);color:#fff;border-color:var(--green)}
.side-btn.short{background:rgba(240,85,85,.2);color:var(--red);border:1px solid transparent}
.side-btn.short.active{background:var(--red);color:#fff;border-color:var(--red)}
.param-row{display:flex;gap:6px;margin-bottom:8px}
.param-row input{flex:1;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none;min-width:0}
.param-row input:focus{border-color:var(--blue)}
.param-row select{flex:1;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none}
.btn-open{width:100%;padding:10px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.btn-open.long{background:var(--green);color:#fff}
.btn-open.short{background:var(--red);color:#fff}
.btn-open:disabled{opacity:.4;cursor:not-allowed}
.risk-bar{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px;padding:8px 12px;margin-top:10px}
.risk-item{display:flex;align-items:center;gap:6px;color:var(--text2);white-space:nowrap}
.risk-item .val{color:var(--text);font-weight:600}
.btn-reset{padding:4px 12px;border:1px solid var(--gold);border-radius:6px;background:transparent;color:var(--gold);cursor:pointer;font-size:12px}
.btn-reset:hover{background:rgba(240,176,80,.15)}.btn-logout{padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text2);cursor:pointer;font-size:12px;white-space:nowrap;transition:.2s}.btn-logout:hover{border-color:var(--red);color:var(--red);background:rgba(240,85,85,.1)}
.signal-bar{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--card2);border-radius:8px;margin-top:6px;font-size:13px;flex-wrap:wrap}
.signal-item{display:flex;align-items:center;gap:4px}
.log-box{max-height:300px;overflow-y:auto;font-size:12px;color:var(--text2);padding:4px 0;margin-top:6px;scrollbar-width:thin}
.log-box::-webkit-scrollbar{width:4px}
.log-box::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.log-entry{padding:2px 0;border-bottom:1px solid rgba(42,53,96,.3)}
.log-entry .time{color:var(--text2);margin-right:8px}
.log-entry.positive{color:var(--green)}.log-entry.negative{color:var(--red)}
.loading-chart{display:flex;align-items:center;justify-content:center;height:360px;color:var(--text2);font-size:14px}
.trail-info{display:flex;gap:12px;padding:8px 4px;flex-wrap:wrap;font-size:12px;margin-top:0}.trail-info .ti-item{display:flex;align-items:center;gap:4px}.trail-info .ti-label{color:var(--text2);white-space:nowrap}.trail-info .ti-val{font-weight:600;font-family:monospace}.trail-info .ti-sl{color:var(--red)}.trail-info .ti-tp{color:var(--green)}.trail-info .ti-activated{color:#f0b90b}.trail-info .ti-regime{color:#888}.trail-loading{color:var(--text2);font-style:italic}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:8px;font-size:14px;z-index:100;transition:.3s;opacity:0;pointer-events:none}
.toast.show{opacity:1}
.toast.success{background:rgba(0,192,135,.9);color:#fff}
.toast.error{background:rgba(240,85,85,.9);color:#fff}
.toast.info{background:rgba(59,130,246,.9);color:#fff}
.ctrl-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctrl-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2);white-space:nowrap}
.ctrl-item input[type=range]{width:52px;height:4px;accent-color:var(--accent);cursor:pointer;background:var(--border);border-radius:2px;appearance:none;-webkit-appearance:none}
.ctrl-item input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--accent);cursor:pointer}
.ctrl-val{color:var(--text);font-weight:600;min-width:24px;text-align:center}
.ctrl-select{background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:11px;padding:2px 4px;cursor:pointer;outline:none}
.trail-timing{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:3px 8px 5px;font-size:11px;color:var(--text-dim);border-top:1px solid var(--border-color,#333)}
.trail-timing .ti-item{white-space:nowrap}
.trail-timing .ti-badge{padding:1px 6px;border-radius:4px;font-weight:600;font-size:10px}
.trail-timing .ti-running{background:#162;color:#4f4}
.trail-timing .ti-stopped{background:#222;color:#888}
</style>
</head>
<body>
<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <h2>🔷AI合约自动交易系统</h2>
    <input type="password" id="loginPass" placeholder="请输入密码" autocomplete="off">
    <button class="btn-login" onclick="doLogin()">登 录</button>
    <div class="error" id="loginError">密码错误</div>
  </div>
</div>

<div class="container hidden" id="app">
  <div class="top-bar">
    <div class="logo">🔷AI合约自动交易系统</div>
    <div class="balance-box">
      余额: <span class="num" id="balanceVal">--</span>
      <span class="pnl" id="dailyPnl">(日盈亏: --)</span>
    </div>
    <div class="style-group" id="styleGroup">
      <button class="style-btn" data-style="conservative" onclick="setStyle('conservative')">保守</button>
      <button class="style-btn active" data-style="moderate" onclick="setStyle('moderate')">稳健</button>
      <button class="style-btn" data-style="aggressive" onclick="setStyle('aggressive')">激进</button>
    </div>
    <div class="toggle-group">
      <div class="toggle" id="strategyToggle" onclick="toggleStrategy()"><div class="knob"></div></div>
      <span class="toggle-label" id="strategyLabel">策略停止</span>
    </div>
    <span class="status-badge off" id="riskBadge">⏸ 风控正常</span>
    <div class="ctrl-group">
      <div class="ctrl-item">
        <span title="追踪止盈检查间隔">⏱</span>
        <input type="range" id="trailSlider" min="1" max="120" value="30" oninput="updateTrailUI(this.value)" onchange="commitTrailInterval(this.value)">
        <span class="ctrl-val" id="trailLabel">30s</span>
      </div>
      <div class="ctrl-item">
        <span title="界面刷新频率">🔄</span>
        <select class="ctrl-select" id="refreshSelect" onchange="commitRefreshInterval(this.value)">
          <option value="1">1s</option>
          <option value="3">3s</option>
          <option value="5" selected>5s</option>
          <option value="10">10s</option>
          <option value="30">30s</option>
          <option value="60">60s</option>
        </select>
      </div>
    </div>
    <button class="btn-logout" onclick="logout()" title="退出登录切换账号">🚪 切换</button>
  </div>

  <div class="main-grid">
    <div class="chart-section">
      <div class="chart-header">
        <div>
          <span class="symbol" id="chartSymbol">ETH/USDT</span>
          <span style="font-size:12px;color:var(--text2);margin-left:8px" id="fundingRate">资金费率: --</span>
        </div>
        <div><span class="price" id="currentPrice">--</span></div>
      </div>
      <div class="chart-header" style="margin-top:0">
        <div class="tf-group" id="tfGroup">
          <button class="tf-btn active" data-tf="1m" onclick="switchTF('1m')">1m</button>
          <button class="tf-btn" data-tf="5m" onclick="switchTF('5m')">5m</button>
          <button class="tf-btn" data-tf="15m" onclick="switchTF('15m')">15m</button>
          <button class="tf-btn" data-tf="1h" onclick="switchTF('1h')">1h</button>
        </div>
        <div style="display:flex;gap:4px">
          <button class="sym-btn active" data-chart-sym="ETH/USDT" onclick="switchChartSymbol('ETH/USDT')">ETH</button>
          <button class="sym-btn" data-chart-sym="BTC/USDT" onclick="switchChartSymbol('BTC/USDT')">BTC</button>
        </div>
      </div>
      <div id="chart"><div class="loading-chart">加载中...</div></div>
<div class="trail-info" id="trailInfo">
        <div class="trail-loading">追踪状态加载中...</div>
      </div>
      <div class="trail-timing" id="trailTimingInfo"></div>
    </div>

    <div class="right-panel">
      <div class="card">
        <div class="card-title">📊 当前持仓</div>
        <div id="positionsContainer"><div class="no-pos">暂无持仓</div></div>
      </div>
      <div class="card">
        <div class="card-title">🎯 手动交易</div>
        <div class="trade-controls">
          <div class="symbol-select" id="tradeSymbols">
            <button class="sym-btn active" data-trade-sym="ETH/USDT" onclick="selectTradeSymbol('ETH/USDT')">ETH/USDT</button>
            <button class="sym-btn" data-trade-sym="BTC/USDT" onclick="selectTradeSymbol('BTC/USDT')">BTC/USDT</button>
          </div>
          <div class="side-btns">
            <button class="side-btn long active" id="sideLong" onclick="selectSide('long')">做多 ▴</button>
            <button class="side-btn short" id="sideShort" onclick="selectSide('short')">做空 ▾</button>
          </div>
          <div class="param-row">
            <input type="number" id="tradeQty" placeholder="数量" step="0.001" value="0.01">
            <select id="tradeLeverage">
              <option value="2">2x</option>
              <option value="5" selected>5x</option>
              <option value="10">10x</option>
              <option value="20">20x</option>
              <option value="50">50x</option>
            </select>
          </div>
          <button class="btn-open long" id="btnOpen" onclick="manualOpen()">开多 ETH/USDT</button>
        </div>
      </div>
    </div>
  </div>

  <div class="risk-bar">
    <div class="risk-item" id="riskFloatingPnlRow" style="display:none">💹 持仓浮盈: <span class="val" id="riskFloatingPnl">--</span></div>
    <div class="risk-item">📈 日盈亏: <span class="val" id="riskDailyPnl">--</span></div>
    <div class="risk-item">📊 胜率: <span class="val" id="riskWinRate">--</span></div>
    <div class="risk-item">📉 最大回撤: <span class="val" id="riskDrawdown">--</span></div>
    <div class="risk-item">🛡️ 熔断: <span class="val" id="riskFrozen">否</span></div>
    <button class="btn-reset" onclick="resetCircuitBreaker()">重置熔断</button>
  </div>
  <div class="signal-bar" id="signalBar">
    <div class="signal-item" id="signalTrend">📊 趋势: <span class="val" style="color:var(--text2)">等待数据...</span></div>
    <div class="signal-item" id="signalMomentum">⚡ 动量: <span class="val" style="color:var(--text2)">--</span></div>
    <div class="signal-item" id="signalRSI">📉 RSI: <span class="val" style="color:var(--text2)">--</span></div>
    <div class="signal-item" id="signalScore">⭐ 综合评分: <span class="val" style="color:var(--text2)">--</span></div>
  </div>
  <div class="card" style="margin-top:10px">
    <div class="card-title">📝 操作日志</div>
    <div class="log-box" id="tradeLogs"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let state = {
  token: localStorage.getItem('cex_token') || '',
  role: localStorage.getItem('cex_role') || 'admin',
  chartSymbol: 'ETH/USDT',
  tradeSymbol: 'ETH/USDT',
  tradeSide: 'long',
  timeframe: '1m',
  style: 'moderate',
  strategyRunning: false,
  chart: null,
  candleSeries: null,
  volumeSeries: null,
};

async function doLogin() {
  const pass = document.getElementById('loginPass').value;
  document.getElementById('loginError').style.display = 'none';
  try {
    const r = await fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password: pass})
    });
    const d = await r.json();
    if (d.token) {
      state.token = d.token; state.role = d.role || 'admin';
      localStorage.setItem('cex_token', d.token);
      localStorage.setItem('cex_role', d.role || 'admin');
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      init();
    } else {
      document.getElementById('loginError').textContent = d.error || '登录失败';
      document.getElementById('loginError').style.display = 'block';
    }
  } catch(e) {
    document.getElementById('loginError').textContent = '网络错误';
    document.getElementById('loginError').style.display = 'block';
  }
}
if (state.token) {
  (async()=>{
    try {
      const r = await fetch('/api/auth/check',{headers:{'Authorization':'Bearer '+state.token}});
      if (r.ok) { document.getElementById('authScreen').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); init(); return; }
    } catch(e) {}
    localStorage.removeItem('cex_token'); state.token = '';
  })();
}

async function api(path, opts={}) {
  if (!opts.headers) opts.headers = {};
  opts.headers['Authorization'] = 'Bearer ' + state.token;
  opts.headers['Content-Type'] = 'application/json';
  try {
    const r = await fetch(path, opts);
    if (r.status === 401) { localStorage.removeItem('cex_token'); location.reload(); return null; }
    return await r.json();
  } catch(e) { return null; }
}
function showToast(msg, type='info') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + type + ' show';
  clearTimeout(t._hide); t._hide = setTimeout(()=>t.classList.remove('show'), 3000);
}

async function init() {
  if (state.role === 'readonly') {
    document.getElementById('trailSlider').disabled = true;
  }
  await loadStatus(); initChart();
  // 等图表挂载完成后再取 K 线数据
  setTimeout(() => { loadOHLCV(); }, 300);
  loadPositions(); loadRiskStatus(); loadStrategyStatus();
  loadTrailInterval(); startSSE(); startPolling(); loadTrailState();
}
async function loadTrailInterval() {
  const d = await api('/api/cex/trail-interval');
  if (d && d.intervalMs) {
    const sec = d.intervalMs / 1000;
    document.getElementById('trailSlider').value = sec;
    document.getElementById('trailLabel').textContent = sec + 's';
  }
}
async function loadStatus() {
  const d = await api('/api/cex/status');
  if (!d) return;
  if (d.currentStyle) {
    state.style = d.currentStyle;
    document.querySelectorAll('.style-btn').forEach(b=>b.classList.toggle('active', b.dataset.style === state.style));
  }
}
async function setStyle(s) {
  const d = await api('/api/cex/style', {method:'POST', body: JSON.stringify({style: s})});
  if (!d || d.error) return showToast(d?.error || '切换失败', 'error');
  document.querySelectorAll('.style-btn').forEach(b=>b.classList.toggle('active', b.dataset.style === s));
  state.style = s; loadRiskStatus(); showToast('已切换为 ' + (d.label || s), 'success');
}
async function toggleStrategy() {
  if (state.strategyRunning) {
    const d = await api('/api/cex/strategy/stop', {method:'POST'});
    if (!d || d.error) return showToast(d?.error || '停止失败', 'error');
    state.strategyRunning = false;
  } else {
    const d = await api('/api/cex/strategy/start', {method:'POST'});
    if (!d || d.error) return showToast(d?.error || '启动失败', 'error');
    state.strategyRunning = true;
  }
  updateStrategyUI();
}
async function loadStrategyStatus() {
  const d = await api('/api/cex/strategy/status');
  if (d) { state.strategyRunning = d.running; updateStrategyUI(); }
}
function updateStrategyUI() {
  document.getElementById('strategyToggle').classList.toggle('active', state.strategyRunning);
  const l = document.getElementById('strategyLabel');
  l.classList.toggle('active', state.strategyRunning);
  l.textContent = state.strategyRunning ? '策略运行中' : '策略停止';
}

function initChart() {
  const container = document.getElementById('chart');
  container.innerHTML = '';
  state.chart = LightweightCharts.createChart(container, {
    layout: {background:{type:'solid',color:'#131a2b'}, textColor:'#7a8ab5'},
    grid: {vertLines:{color:'rgba(42,53,96,0.4)'}, horzLines:{color:'rgba(42,53,96,0.4)'}},
    crosshair: {mode: LightweightCharts.CrosshairMode.Normal},
    rightPriceScale: {borderColor:'rgba(42,53,96,0.6)', scaleMargins:{top:0.1,bottom:0.3}},
    timeScale: {borderColor:'rgba(42,53,96,0.6)', timeVisible:true, secondsVisible:false},
    handleScroll: {vertTouchDrag:false},
  });
  state.candleSeries = state.chart.addCandlestickSeries({
    upColor:'#00c087', downColor:'#f05555', borderUpColor:'#00c087', borderDownColor:'#f05555',
    wickUpColor:'#00c087', wickDownColor:'#f05555'
  });
  state.volumeSeries = state.chart.addHistogramSeries({
    priceFormat: {type:'volume'}, priceScaleId:'volume', scaleMargins:{top:0.8,bottom:0}
  });
  state.volumeSeries.priceScale().applyOptions({scaleMargins:{top:0.8,bottom:0}});
  state.chart.timeScale().fitContent();
}
async function loadOHLCV() {
  const d = await api('/api/cex/ohlcv?symbol='+encodeURIComponent(state.chartSymbol)+'&timeframe='+state.timeframe+'&limit=200');
  if (!d || !d.success) return;
  const ohlcv = d.data || d.ohlcv || [];
  if (ohlcv.length === 0) return;
  // 支持两种格式: array of arrays [time,open,high,low,close,vol] 或 array of objects {timestamp,open,high,low,close,volume}
  const candles = ohlcv.map(c => Array.isArray(c)
    ? {time: c[0]/1000, open: c[1], high: c[2], low: c[3], close: c[4]}
    : {time: c.timestamp/1000, open: c.open, high: c.high, low: c.low, close: c.close}
  );
  const volumes = ohlcv.map(c => Array.isArray(c)
    ? {time: c[0]/1000, value: c[5], color: c[4] >= c[1] ? 'rgba(0,192,135,0.3)' : 'rgba(240,85,85,0.3)'}
    : {time: c.timestamp/1000, value: c.volume || 0, color: c.close >= c.open ? 'rgba(0,192,135,0.3)' : 'rgba(240,85,85,0.3)'}
  );
  state.candleSeries.setData(candles);
  state.volumeSeries.setData(volumes);
  state.chart.timeScale().fitContent();
  if (candles.length > 0) updatePrice(candles[candles.length-1].close, candles[candles.length-1].open);
}
function updatePrice(close, open) {
  const el = document.getElementById('currentPrice');
  el.textContent = '$' + (typeof close === 'number' ? close.toFixed(2) : close);
  el.className = 'price ' + (close >= open ? 'change' : 'drop');
}
async function switchTF(tf) {
  state.timeframe = tf;
  document.querySelectorAll('.tf-btn').forEach(b=>b.classList.toggle('active', b.dataset.tf === tf));
  loadOHLCV();
}
async function switchChartSymbol(sym) {
  state.chartSymbol = sym;
  document.querySelectorAll('[data-chart-sym]').forEach(b=>b.classList.toggle('active', b.dataset.chartSym === sym));
  document.getElementById('chartSymbol').textContent = sym; loadOHLCV(); loadTrailState();
}

function selectTradeSymbol(sym) {
  state.tradeSymbol = sym;
  document.querySelectorAll('[data-trade-sym]').forEach(b=>b.classList.toggle('active', b.dataset.tradeSym === sym));
  updateOpenBtn();
}
function selectSide(side) {
  state.tradeSide = side;
  document.getElementById('sideLong').classList.toggle('active', side==='long');
  document.getElementById('sideShort').classList.toggle('active', side==='short');
  updateOpenBtn();
}
function updateOpenBtn() {
  const btn = document.getElementById('btnOpen');
  btn.textContent = (state.tradeSide==='long'?'开多':'开空') + ' ' + state.tradeSymbol;
  btn.className = 'btn-open ' + state.tradeSide;
}
async function manualOpen() {
  const qty = parseFloat(document.getElementById('tradeQty').value);
  const lev = parseInt(document.getElementById('tradeLeverage').value);
  if (!qty || qty <= 0) return showToast('请输入有效数量', 'error');
  const d = await api('/api/cex/position/open', {method:'POST', body: JSON.stringify({symbol: state.tradeSymbol, side: state.tradeSide, contracts: qty, leverage: lev})});
  if (!d) return showToast('请求失败', 'error');
  if (d.error) return showToast(d.error, 'error');
  showToast('✅ '+(state.tradeSide==='long'?'做多':'做空')+' '+qty+' '+state.tradeSymbol+'成功', 'success');
  loadPositions(); loadRiskStatus();
}
async function manualClose(symbol, side) {
  const d = await api('/api/cex/position/close', {method:'POST', body: JSON.stringify({symbol, side, percent:100})});
  if (!d || d.error) return showToast(d?.error||'平仓失败', 'error');
  showToast('✅ 已平仓 '+symbol, 'success');
  loadPositions(); loadRiskStatus();
}

async function loadPositions() {
  const d = await api('/api/cex/positions');
  if (!d) return;
  const container = document.getElementById('positionsContainer');
  if (!d.success || !d.positions || d.positions.length===0) {
    container.innerHTML = '<div class="no-pos">暂无持仓</div>'; return;
  }
  container.innerHTML = d.positions.map(pos => {
    const side = (pos.side||'').toLowerCase();
    const isLong = side==='long';
    const pnl = pos.unrealizedPnl||0;
    const pnlPct = pos.percentage||0;
    const liq = pos.liquidationPrice||'--';
    const mark = pos.markPrice||pos.lastPrice||'--';
    const entry = pos.entryPrice||'--';
    return '<div class="position '+(isLong?'':'short')+'">'+
      '<div class="pos-symbol">'+(pos.symbol||'--')+' <span class="side '+(isLong?'side-long':'side-short')+'">'+(isLong?'做多':'做空')+'</span></div>'+
      '<div class="pos-detail">'+
        '<span class="label">数量</span><span class="value">'+(pos.contracts||pos.size||'--')+'</span>'+
        '<span class="label">开仓价</span><span class="value">$'+(typeof entry==='number'?entry.toFixed(2):entry)+'</span>'+
        '<span class="label">标记价</span><span class="value">$'+(typeof mark==='number'?mark.toFixed(2):mark)+'</span>'+
        '<span class="label">浮盈</span><span class="value '+(pnl>=0?'pnl-pos':'pnl-neg')+'">'+(pnl>=0?'+':'')+'$'+pnl.toFixed(2)+' ('+(pnlPct>=0?'+':'')+pnlPct.toFixed(2)+'%)</span>'+
        '<span class="label">强平</span><span class="value" style="color:'+(liq!=='--'?'var(--red)':'var(--text2)')+'">$'+(typeof liq==='number'?liq.toFixed(2):liq)+'</span>'+
      '</div>'+
      '<button class="btn-close" onclick="manualClose(\''+pos.symbol+'\',\''+side+'\')">平仓</button></div>';
  }).join('');
}

async function loadRiskStatus() {
  const d = await api('/api/cex/risk/status');
  if (!d) return;
  // 加载持仓浮盈
  try {
    const posRes = await api('/api/cex/positions');
    if (posRes && posRes.success && posRes.positions && posRes.positions.length > 0) {
      let totalUpnl = 0, showDetails = [];
      for (const p of posRes.positions) {
        const pnl = p.unrealizedPnl || 0;
        totalUpnl += pnl;
        const sym = (p.symbol || '').replace(':USDT','');
        const side = (p.side||'').toLowerCase() === 'long' ? '多' : '空';
        const pct = p.percentage || 0;
        showDetails.push(sym + ' ' + side + ' $' + pnl.toFixed(2) + ' (' + pct.toFixed(1) + '%)');
      }
      document.getElementById('riskFloatingPnl').textContent = '$' + (totalUpnl >= 0 ? '+' : '') + totalUpnl.toFixed(2);
      document.getElementById('riskFloatingPnl').className = 'val ' + (totalUpnl >= 0 ? 'pnl-pos' : 'pnl-neg');
      document.getElementById('riskFloatingPnlRow').style.display = '';
      document.getElementById('riskFloatingPnl').title = showDetails.join(' | ');
    } else {
      document.getElementById('riskFloatingPnlRow').style.display = 'none';
    }
  } catch(e) { document.getElementById('riskFloatingPnlRow').style.display = 'none'; }

  document.getElementById('riskDailyPnl').textContent = '$'+(d.dailyPnl>=0?'+':'')+(d.dailyPnl||0).toFixed(2)+' ('+(d.dailyPnlPercent||0).toFixed(1)+'%)';
  document.getElementById('riskDailyPnl').className = 'val '+((d.dailyPnl||0)>=0?'pnl-pos':'pnl-neg');
  document.getElementById('riskFrozen').textContent = d.isFrozen?'⚠️ 已熔断':'✅ 正常';
  document.getElementById('riskFrozen').style.color = d.isFrozen?'var(--red)':'var(--green)';
  const badge = document.getElementById('riskBadge');
  if (d.isFrozen||d.circuitBreaker?.active) { badge.className='status-badge warn'; badge.textContent='🚨 熔断中'; }
  else { badge.className='status-badge on'; badge.textContent='✅ 风控正常'; }
  if (d.dailyPnl!==undefined) {
    const start = d.startBalance||30;
    const cur = d.currentBalance||start;
    document.getElementById('balanceVal').textContent = '$'+cur.toFixed(2);
    document.getElementById('dailyPnl').textContent = '(日盈亏: '+(d.dailyPnl>=0?'+':'')+d.dailyPnl.toFixed(2)+')';
    document.getElementById('dailyPnl').className = 'pnl '+(d.dailyPnl>=0?'pnl-pos':'pnl-neg');
  }
  if (d.winRate) document.getElementById('riskWinRate').textContent = d.winRate;
  if (d.maxDrawdown!==undefined) document.getElementById('riskDrawdown').textContent = d.maxDrawdown.toFixed(1)+'%';
}
async function resetCircuitBreaker() {
  const d = await api('/api/cex/risk/reset',{method:'POST'});
  if (!d||d.error) return showToast(d?.error||'重置失败','error');
  showToast('✅ 熔断已重置','success'); loadRiskStatus();
}

let trailPriceLines = {};

async function loadTrailState() {
  const d = await api('/api/cex/strategy/trail-state');
  if (!d || Object.keys(d).length === 0) {
    document.getElementById('trailInfo').innerHTML = '<div class="trail-loading">无活跃追踪</div>';
    return;
  }
  const sym = state.chartSymbol;
  const symKey = Object.keys(d).find(k => k.includes(sym.replace(':USDT','')) || sym.includes(k.replace(':USDT','')));
  const ts = symKey ? d[symKey] : null;
  if (!ts) {
    document.getElementById('trailInfo').innerHTML = '<div class="trail-loading">当前币种无追踪</div>';
    return;
  }
  const icons = { trending:'📈', ranging:'📊', volatile:'🌊', transitioning:'🔄' };
  const regimeNames = { trending:'趋势', ranging:'震荡', volatile:'高波动', transitioning:'趋势转换' };
  const regimeIcon = icons[ts.marketRegime] || '❓';
  const regimeName = regimeNames[ts.marketRegime] || '未知';
  const activated = ts.trailActivated ? '<span class="ti-activated">✅ 已激活</span>' : '<span>⏸ 待触发</span>';
  const atrPct = ts.atrPercent || 0;
  document.getElementById('trailInfo').innerHTML =
    '<span class="ti-item"><span class="ti-label">🛑 止损</span><span class="ti-val ti-sl">$' + (ts.slPrice||0).toFixed(2) + '</span></span>' +
    '<span class="ti-item"><span class="ti-label">✅ 止盈</span><span class="ti-val ti-tp">$' + (ts.tpPrice||0).toFixed(2) + '</span></span>' +
    '<span class="ti-item">' + activated + '</span>' +
    '<span class="ti-item"><span class="ti-regime">' + regimeIcon + ' ' + regimeName + '</span></span>' +
    '<span class="ti-item"><span class="ti-label">ATR</span><span class="ti-val">' + atrPct.toFixed(1) + '%</span></span>';
  updateTrailLines(sym, ts.slPrice, ts.tpPrice);
  // 生成策略状态摘要（多币种）
  updateSummaryFromAll(d);

}

function updateSummaryFromAll(allStates) {
  const keys = Object.keys(allStates);
  if (keys.length === 0) {
    document.getElementById('trailTimingInfo').innerHTML = '<span class="ti-badge ti-stopped">⚫ 已停止</span>';
    return;
  }
  let html = '<span class="ti-badge ti-running">🟢 策略运行中</span><br>';
  for (const k of keys) {
    const s = allStates[k];
    const isLong = s.slPrice < s.tpPrice;
    const sideName = isLong ? '多' : '空';
    const sideIcon = isLong ? '▴' : '▾';
    const moving = s.trailActivated && s.slPrice !== s.bestStop ? '，还在上移中' : '';
    html += '<span class="ti-item"><b>' + k.replace(':USDT','') + '</b> ' + sideIcon + '持' + sideName +
      '，止盈 $' + (s.tpPrice||0).toFixed(2) + ' → 已追踪，止损 $' + (s.slPrice||0).toFixed(2) + moving + '</span><br>';
  }
  document.getElementById('trailTimingInfo').innerHTML = html;
}

function updateTrailLines(sym, sl, tp) {
  if (!state.candleSeries) return;
  const key = sym.replace(':USDT','');
  if (trailPriceLines[key]) {
    try { state.candleSeries.removePriceLine(trailPriceLines[key].sl); } catch(e) {}
    try { state.candleSeries.removePriceLine(trailPriceLines[key].tp); } catch(e) {}
  }
  trailPriceLines[key] = {};
  if (sl && sl > 0) {
    trailPriceLines[key].sl = state.candleSeries.createPriceLine({
      price: sl, color: '#ef4444', lineWidth: 1, lineStyle: 2,
      axisLabelVisible: true, title: 'SL',
    });
  }
  if (tp && tp > 0) {
    trailPriceLines[key].tp = state.candleSeries.createPriceLine({
      price: tp, color: '#22c55e', lineWidth: 1, lineStyle: 2,
      axisLabelVisible: true, title: 'TP',
    });
  }
}

let sseReconnectTimer = null;
function startSSE() {
  if (sseReconnectTimer) clearTimeout(sseReconnectTimer);
  const evtSource = new EventSource('/api/cex/stream?token='+state.token);
  evtSource.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (!data) return;
      if (data.ticker && data.ticker.symbol===state.chartSymbol) updatePrice(data.ticker.last, data.ticker.open);
      if (data.signals) updateSignals(data.signals);
      if (data.funding!==undefined) document.getElementById('fundingRate').textContent = '资金费率: '+(data.funding*100).toFixed(4)+'%';
      if (data.strategyRunning!==undefined) { state.strategyRunning=data.strategyRunning; updateStrategyUI(); }
      if (data.logs && data.logs.length>0) updateLogs(data.logs);
    } catch(e) {}
  };
  evtSource.onerror = () => { evtSource.close(); sseReconnectTimer=setTimeout(startSSE,5000); };
}
function updateSignals(signals) {
  if (!signals) return;
  const s = signals[state.chartSymbol] || signals[Object.keys(signals)[0]];
  if (!s) return;
  if (s.trend) {
    const t=s.trend; const bull=t.includes('Bull')||t.includes('bull')||t.includes('long')||t.includes('up'); const bear=t.includes('Bear')||t.includes('bear')||t.includes('short')||t.includes('down');
    document.getElementById('signalTrend').innerHTML = '📊 趋势: <span class="val" style="color:'+(bull?'var(--green)':bear?'var(--red)':'var(--text2)')+'">'+t+'</span>';
  }
  if (s.rsi!==undefined) {
    document.getElementById('signalRSI').innerHTML = '📉 RSI: <span class="val" style="color:'+(s.rsi>70?'var(--red)':s.rsi<30?'var(--green)':'var(--text2)')+'">'+s.rsi.toFixed(1)+'</span>';
  }
  if (s.momentum!==undefined) document.getElementById('signalMomentum').innerHTML = '⚡ 动量: <span class="val" style="color:'+(s.momentum>0?'var(--green)':'var(--red)')+'">'+(s.momentum>0?'+':'')+s.momentum.toFixed(2)+'%</span>';
  if (s.score!==undefined || s.totalScore!==undefined) {
    const sc=s.score!==undefined?s.score:s.totalScore;
    document.getElementById('signalScore').innerHTML = '⭐ 综合评分: <span class="val" style="color:'+(sc>0?'var(--green)':sc<0?'var(--red)':'var(--text2)')+'">'+(sc>0?'+':'')+sc.toFixed(1)+'</span>';
  }
}

let logBuffer=[];
function updateLogs(logs) {
  if (!logs||!logs.length) return;
  logBuffer = logs.slice(0,30);
  const el = document.getElementById('tradeLogs');
  el.innerHTML = logBuffer.map(l => {
    const t=l.time||l.timestamp||'', timeStr=typeof t==='string'?t.slice(11,19):'';
    const isPos=(l.pnl||0)>=0&&l.pnl!==undefined;
    return '<div class="log-entry '+(l.pnl!==undefined?(isPos?'positive':'negative'):'')+'"><span class="time">'+timeStr+'</span>'+(l.message||l.log||l.action||'')+'</div>';
  }).join('');
}

let pollTimer=null;
const REFRESH_INTERVAL_MS = 3000; // 前端刷新固定3秒
function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(()=>{loadPositions();loadRiskStatus();loadStrategyStatus();loadLogs();loadTrailState();}, REFRESH_INTERVAL_MS);
}
function updateTrailUI(val) {
  document.getElementById('trailLabel').textContent = val + 's';
}
async function commitTrailInterval(val) {
  const d = await api('/api/cex/trail-interval', {method:'POST',body:JSON.stringify({interval: parseInt(val) * 1000})});
  if (d && d.success) {
    document.getElementById('trailLabel').textContent = (d.intervalMs / 1000) + 's';
    document.getElementById('trailSlider').value = d.intervalMs / 1000;
    showToast('止盈检查间隔: ' + (d.intervalMs / 1000) + '秒');
  }
}
function commitRefreshInterval(val) {
  if (pollTimer) {
    clearInterval(pollTimer);
    pollTimer = setInterval(()=>{loadPositions();loadRiskStatus();loadStrategyStatus();loadLogs();loadTrailState();}, parseInt(val) * 1000);
  }
  showToast('刷新间隔: ' + val + '秒');
}
async function logout() {
  localStorage.removeItem('cex_token');
  localStorage.removeItem('cex_role');
  state.token = '';
  state.role = '';
  document.getElementById('authScreen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginPass').value = '';
  document.getElementById('loginError').style.display = 'none';
}
let logPage = 0;
async function loadLogs(page) {
  if (page !== undefined) logPage = page;
  const offset = logPage * 20;
  const d = await api('/api/cex/logs?count=20&offset='+offset);
  if (d && d.success) renderLogs(d.logs, d.total);
}
const LOG_ICONS = {
  auto_open:'🤖', auto_open_fail:'⚠️', auto_close:'🤖',
  manual_open:'🖱', manual_open_fail:'❌', manual_close:'🖱', manual_close_fail:'❌',
  strategy_start:'▶️', strategy_stop:'⏹', style_change:'🎨',
  leverage_change:'⚙️', poll_change:'⏱', risk_reset:'🔄', ui_event:'📋'
};
function renderLogs(logs, total) {
  const el = document.getElementById('tradeLogs');
  const maxPage = Math.max(0, Math.ceil(total / 20) - 1);
  if (!logs || logs.length === 0) {
    el.innerHTML = '<div class="log-empty">暂无操作日志</div>';
    return;
  }
  let html = '';
  for (const l of logs) {
    const icon = LOG_ICONS[l.type] || '📌';
    const t = new Date(l.time);
    const time = ('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2)+':'+('0'+t.getSeconds()).slice(-2);
    html += '<div class="log-entry type-'+l.type+'"><span class="icon">'+icon+'</span><span class="time">'+time+'</span><span class="detail">'+l.detail+'</span></div>';
  }
  html += '<div class="log-pagination">';
  html += '<button onclick="loadLogs(0)" '+(logPage<=0?'disabled':'')+'>«</button>';
  html += '<button onclick="loadLogs('+(logPage-1)+')" '+(logPage<=0?'disabled':'')+'>‹</button>';
  html += '<span class="page-info">'+(total>0?(logPage+1)+'/'+(maxPage+1):'0/0')+'</span>';
  html += '<button onclick="loadLogs('+(logPage+1)+')" '+(logPage>=maxPage?'disabled':'')+'>›</button>';
  html += '<button onclick="loadLogs('+maxPage+')" '+(logPage>=maxPage?'disabled':'')+'>»</button>';
  html += '</div>';
  el.innerHTML = html;
}
</script>
